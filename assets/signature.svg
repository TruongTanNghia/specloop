<svg xmlns="http://www.w3.org/2000/svg" width="560" height="170" viewBox="0 0 560 170" role="img" aria-label="Chữ ký Trương Tấn Nghĩa – AI Học Lập Trình, Never give up">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E4A63"/>
      <stop offset="0.55" stop-color="#1E8FA8"/>
      <stop offset="1" stop-color="#F28C1B"/>
    </linearGradient>
  </defs>

  <text x="280" y="92" text-anchor="middle" font-size="52"
        font-family="'Segoe Script', 'Brush Script MT', 'Snell Roundhand', 'Apple Chancery', 'Lucida Handwriting', cursive"
        fill="url(#ink)" fill-opacity="0" stroke="#0E4A63" stroke-width="1.2" stroke-linejoin="round"
        stroke-dasharray="900" stroke-dashoffset="900">Trương Tấn Nghĩa<animate attributeName="stroke-dashoffset" from="900" to="0" dur="2.6s" begin="0.2s" fill="freeze"/><animate attributeName="fill-opacity" from="0" to="1" dur="1s" begin="2.2s" fill="freeze"/><animate attributeName="stroke-opacity" from="1" to="0.15" dur="1s" begin="2.6s" fill="freeze"/></text>

  <path d="M78,116 C160,98 232,132 300,116 S420,100 488,114" fill="none" stroke="#F28C1B" stroke-width="3"
        stroke-linecap="round" stroke-dasharray="440" stroke-dashoffset="440">
    <animate attributeName="stroke-dashoffset" from="440" to="0" dur="1.2s" begin="2s" fill="freeze"/>
  </path>

  <text x="280" y="150" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="4"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#0E4A63" fill-opacity="0">AI HỌC LẬP TRÌNH · NEVER GIVE UP<animate attributeName="fill-opacity" from="0" to="0.75" dur="1.2s" begin="2.8s" fill="freeze"/></text>
</svg>
